services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      # 必要に応じて：DOTNET_WATCH_SUPPRESS_LAUNCH: "1"
    volumes:
      - .:/workspace
      - nuget:/root/.nuget/packages
      - nogit:/workspace/.git
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    tty: true
    stdin_open: true

  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imageapi}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres} # ← devでもtrustより安全
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-imageapi}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nuget:
  pgdata:
  nogit:
