services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "1"   # Windows/WSL での変更検知安定化
    volumes:
      - .:/workspace                          # ソースをマウント
      - nuget:/root/.nuget/packages           # NuGet キャッシュ
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

volumes:
  nuget:
  pgdata:
